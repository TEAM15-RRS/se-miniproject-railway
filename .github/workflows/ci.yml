
name: CI

# Runs on every push and every pull request: build -> unit tests -> integration tests.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit + integration tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Memory-safety checks (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DRRS_SANITIZE=ON

      - name: Build
        run: cmake --build build-san --parallel

      - name: Run tests under sanitizers
        run: ctest --test-dir build-san --output-on-failure

  valgrind:
    name: Valgrind leak check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y valgrind

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      - name: Valgrind on unit tests
        run: valgrind --leak-check=full --error-exitcode=1 ./build/unit_tests

      - name: Valgrind on integration tests
        run: valgrind --leak-check=full --error-exitcode=1 ./build/integration_tests

