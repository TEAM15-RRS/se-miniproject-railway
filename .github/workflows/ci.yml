
  valgrind:
    name: Valgrind leak check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y valgrind

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      - name: Valgrind on unit tests
        run: valgrind --leak-check=full --error-exitcode=1 ./build/unit_tests

      - name: Valgrind on integration tests
        run: valgrind --leak-check=full --error-exitcode=1 ./build/integration_tests
